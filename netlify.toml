# Serve the single-file Optimesh site (static prototype). The only build step
# records which commit was deployed, so CI can confirm the live site is the
# commit it pushed (GET /version.txt). COMMIT_REF is set by Netlify.
[build]
  command = "printf '%s\\n' \"${COMMIT_REF:-unknown}\" > static/version.txt"
  publish = "static"

# SPA fallback. It is not forced (no `force = true`), so Netlify serves any file
# that exists under static/ first, including static/films/*; only paths with no
# file behind them fall through to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every response. The CSP is the tightest policy the page
# satisfies: everything it loads is same-origin (images, films, captions), it
# uses system fonts only, and the access / contact forms post to Netlify Forms
# with fetch('/'). 'unsafe-inline' stays for script and style because the page
# is one hand-written file with an inline <script>, an inline <style> and many
# style="" attributes. External links (RuleHawk, GitHub, NVIDIA, Netlify) are
# navigations, which the CSP does not govern. frame-ancestors only works as a header.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Film encodes, posters and captions. The file names are not versioned, so a
# day's cache rather than `immutable`: a re-encode reaches visitors within 24h.
[[headers]]
  for = "/films/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# <track> needs text/vtt; state it rather than rely on extension sniffing.
[[headers]]
  for = "/films/0147/captions.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"

[[headers]]
  for = "/films/approved/captions.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"

[[headers]]
  for = "/films/thirteen-commands/captions.vtt"
  [headers.values]
    Content-Type = "text/vtt; charset=utf-8"

# The deployed commit, read by CI after each deploy; never cache it.
[[headers]]
  for = "/version.txt"
  [headers.values]
    Cache-Control = "no-store"
    Content-Type = "text/plain; charset=utf-8"

<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Top-left coverage zone (cyan) -->
  <polygon points="10,12 14,10 18,12 18,16 14,18 10,16" fill="#00E6FF" opacity="0.3"/>
  <!-- Top-right coverage zone (purple) -->
  <polygon points="22,12 26,10 30,12 30,16 26,18 22,16" fill="#8C30E8" opacity="0.3"/>
  <!-- Bottom-left coverage zone (magenta) -->
  <polygon points="10,24 14,22 18,24 18,28 14,30 10,28" fill="#FF00AA" opacity="0.3"/>
  <!-- Bottom-right coverage zone (cyan) -->
  <polygon points="22,24 26,22 30,24 30,28 26,30 22,28" fill="#00E6FF" opacity="0.3"/>

  <!-- Central optimization node -->
  <polygon points="20,16 24,20 20,24 16,20" fill="#00E6FF"/>

  <!-- Connection lines -->
  <line x1="14" y1="14" x2="18" y2="18" stroke="#00E6FF" stroke-width="1" opacity="0.5"/>
  <line x1="26" y1="14" x2="22" y2="18" stroke="#8C30E8" stroke-width="1" opacity="0.5"/>
  <line x1="14" y1="26" x2="18" y2="22" stroke="#FF00AA" stroke-width="1" opacity="0.5"/>
  <line x1="26" y1="26" x2="22" y2="22" stroke="#00E6FF" stroke-width="1" opacity="0.5"/>

  <!-- Coverage zone outlines -->
  <polygon points="10,12 14,10 18,12 18,16 14,18 10,16" stroke="#00E6FF" stroke-width="0.7" fill="none"/>
  <polygon points="22,12 26,10 30,12 30,16 26,18 22,16" stroke="#8C30E8" stroke-width="0.7" fill="none"/>
  <polygon points="10,24 14,22 18,24 18,28 14,30 10,28" stroke="#FF00AA" stroke-width="0.7" fill="none"/>
  <polygon points="22,24 26,22 30,24 30,28 26,30 22,28" stroke="#00E6FF" stroke-width="0.7" fill="none"/>
</svg>
